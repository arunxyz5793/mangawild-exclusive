<!doctype html>
<html lang="en" class="dark">

    <meta property="og:locale" content="en_US" />

    <!-- Schema.org JSON-LD Structured Data for Search Engines -->

    {
      "@context": "https://schema.org",
      "@graph": [
        {

          "url": "https://mangawild.online/",
          "name": "MangaWild Exclusive",
          "description": "Premium indie manga publishing and reader ecosystem featuring exclusive series.",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://mangawild.online/browse?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "Organization",
          "@id": "https://mangawild.online/#organization",
          "name": "MangaWild",
          "url": "https://mangawild.online/",
          "logo": "https://mangawild.online/mangawild-logo.webp",

        }
      ]
